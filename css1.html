<body>
    <h1>Student Registration Form</h1>

 <form class="f">
    <h3  class="he3"><span>Step 1 of 5:</span> Basic Information</h3>

        <label for= "Fullname">Full Name:</label>
        <input type="text" required id="Fullname" >

        <label for= "fathername" >Father Name:</label>
        <input type="text" required id="fathername">

        <label for="date of birth">Date of Birth:</label>
        <input type="date" required id="date of birth"><br><br>
         
        <label for = "cnic" >CNIC/B-form:</label>
        <input type="text" required id="cnic">

        <label for = "contact">Contact no. :</label>
        <input type="text" required id= "contact"><br><br>

        <label for = "email" >Email Address:</label>
        <input type="email" required id="email">
        
        <label for= "Gender">Gender:</label>
        <input type="radio" required name="Gender" id="Gender">Male
        <input type="radio" required name="Gender" id="Gender">Female 

        <h4>Guardian info.</h4>

        <label for= "Fullname">Full Name:</label>
        <input type="text" required id="Fullname">

        <label for= "Relationship">Relationship:</label>
        <select required id="Relationship">
           <option value="">Select</option>
           <option value="father">Father</option>
           <option value="brother">Brother</option>
           <option value="other">Other</option>
        </select>

        <label for = "contact">Contact Number:</label>
        <input type="text" required id= "contact"><br><br>
        
        <button type="save" >Save and Next</button><br><br>
    </form ><br>

    <form class="f">
        <h3 class="he3"><span>Step 2 of 5:</span> Academic Details</h3>
        
        <label for = "education">Previous Education:</label>
        <select required id="education">
           <option value="">Select</option>
           <option value="matric">Matric</option>
           <option value="inter">Inter</option>
        </select><br><br>
        
        <label for= "total marks">Total Marks:</label>
        <input type="text" required id="total marks">

        <label for= "obtained marks">Obtained Marks:</label>
        <input type="text" required id="obtained marks">

        <label for= "percentage" >Percentage%:</label>
        <input type="text" required id="percentage"><br><br>

        <button type="submit">Add</button><br><br>

        <label for = "education">Previous Education:</label>
        <select required id="education">
           <option value="">Select</option>
           <option value="matric">Matric</option>
           <option value="inter">Inter</option>
        </select><br><br>

       <label for= "total marks">Total Marks:</label>
        <input type="text" required id="total marks">

        <label for= "obtained marks">Obtained Marks:</label>
        <input type="text" required id="obtained marks">

        <label for= "percentage" >Percentage%:</label>
        <input type="text" required id="percentage"><br><br>

        <button type="save">Save and Next</button><br><br>

    </form><br>

    <form class="f">
        <h3  class="he3"><span>Step 3 of 5:</span> Programs</h3>

        <label for="degreeProgram">Degree Program:</label>
        <select required id="degreeProgram">
            <option value="">Select</option>
            <option value="BS">BS</option>
            <option value="MS">MS</option>
            <option value="PhD">PhD</option>
        </select><br><br>
        
        <label for="department">Department:</label>
            <input type="checkbox" required id="department">CS
            <input type="checkbox" required id="department">IT
            <input type="checkbox" required id="department">SE
            <input type="checkbox" required id="department">AI
            <br><br>

        <label for="shift">Shift (Morning/Evening):</label>
        <select required id="shift">
            <option value="">Select</option>
            <option value="Morning">Morning</option>
            <option value="Evening">Evening</option>
        </select><br><br>

         <button type="save">Save and Next</button><br><br>

    </form><br>

    <form class="f">
        <h3  class="he3"><span>Step 4 of 5:</span> Required Documents</h3>
        <label for= "profile">Profile image:</label>
        <input type="file" required id="profile" class="doc"><br><br>

        <label for= "front">CNIC front:</label>
        <input type="file" required id="front" class="doc"><br><br>

        <label for= "back">CNIC back:</label>
        <input type="file" required id="back" class="doc"><br><br>

        <label for= "domicile">Domicile:</label>
        <input type="file" required id="domicile" class="doc"><br><br>

        <label for= "matric">Matric result card:</label>
        <input type="file" required id="matric" class="doc"><br><br>

        <label for= "inter">Inter result card:</label>
        <input type="file" required id="inter" class="doc"><br><br>
    
        <button type="save">Save and Next</button><br><br>

    </form><br>
        
    <form class="f">
        <h3  class="he3">Step 5 of 5: Declaration</h3>
         <input type="checkbox" required id="agree">
            <label for = agree>
                I hereby declare that all the information provided by me in this registration form is true, complete, and correct to the best of my knowledge. I understand that if any information is found to be false or misleading, my admission may be cancelled.
            </label><br><br>
            
    </form><br>
    <button type="submit" id="btn">SUBMIT</button><br><br>
    </form><br>
